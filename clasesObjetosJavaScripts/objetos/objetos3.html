<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const objeto = {
            nombre: "Juan",
            edad: 30,
            // 2 formas de declarar una función dentro de un objeto
            saludar: function() {
                console.log(`Hola, mi nombre es ${this.nombre} y tengo ${this.edad} años.`);
            },
            camviarNombre(nombre1) {
                this.nombre = nombre1;
            }

        };
        objeto.saludar();
        objeto.camviarNombre("Pedro");
        objeto.saludar();
    </script>
</body>
</html>
